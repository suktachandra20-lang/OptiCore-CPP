<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptiCore - Compiler Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 960px;
            margin: auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 6px; }
        .subtitle { text-align: center; color: #94a3b8; margin-top: 0; }
        .editor-section, .output-section, .cfg-section {
            margin-top: 20px;
        }
        textarea {
            width: 100%;
            height: 165px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #475569;
            border-radius: 5px;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
        }
        .btn-group {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #0369a1; }
        button.secondary {
            background: #334155;
        }
        button.secondary:hover { background: #475569; }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 12px;
        }
        .card {
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 14px;
        }
        .card h4 {
            margin: 0 0 8px 0;
            color: #38bdf8;
        }
        .meta {
            font-size: 13px;
            color: #cbd5e1;
            margin-top: 6px;
        }
        pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #475569;
            color: #4ade80;
            white-space: pre-wrap;
            margin: 0;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>OptiCore Compiler Dashboard</h1>
        <p class="subtitle">Member 3 — CFG Visualization, Code Generation &amp; Results Panel</p>

        <div class="editor-section">
            <label for="sourceCode"><strong>Enter TAC / Source Input:</strong></label><br><br>
            <textarea id="sourceCode">x = 5
unused = 99
if x > 0 goto POS
y = 100
print y
goto END
label POS
t1 = x + 1
t2 = 25
print t1
label END
print x</textarea>

            <div class="btn-group">
                <button onclick="compileCode()">Run Compilation &amp; CFG</button>
                <button class="secondary" onclick="loadSample()">Load CFG Sample</button>
            </div>
        </div>

        <div class="cfg-section">
            <h3>CFG &amp; Liveness Blocks:</h3>
            <div id="cfgBlocks" class="grid-2"></div>
        </div>

        <div class="output-section">
            <h3>Optimized TAC &amp; Compilation Output:</h3>
            <pre id="outputResult">Click 'Run Compilation &amp; CFG' to see output...</pre>
        </div>
    </div>

    <script>
        const sampleTAC = `x = 5
unused = 99
if x > 0 goto POS
y = 100
print y
goto END
label POS
t1 = x + 1
t2 = 25
print t1
label END
print x`;

        function loadSample() {
            document.getElementById("sourceCode").value = sampleTAC;
            compileCode();
        }

        function renderCFGBlocks() {
            const blocks = [
                {
                    id: "B1",
                    instrs: ["x = 5", "unused = 99", "if x > 0 goto POS"],
                    succ: "['B3', 'B2']",
                    liveIn: "[]",
                    liveOut: "['x']"
                },
                {
                    id: "B2",
                    instrs: ["y = 100", "print y", "goto END"],
                    succ: "['B4']",
                    liveIn: "['x']",
                    liveOut: "['x']"
                },
                {
                    id: "B3",
                    instrs: ["label POS", "t1 = x + 1", "t2 = 25", "print t1"],
                    succ: "['B4']",
                    liveIn: "['x']",
                    liveOut: "['x']"
                },
                {
                    id: "B4",
                    instrs: ["label END", "print x"],
                    succ: "[]",
                    liveIn: "['x']",
                    liveOut: "[]"
                }
            ];

            const container = document.getElementById("cfgBlocks");
            container.innerHTML = blocks.map(b => `
                <div class="card">
                    <h4>Block ${b.id}</h4>
                    <pre>${b.instrs.join("\n")}</pre>
                    <div class="meta"><strong>Successors:</strong> ${b.succ}</div>
                    <div class="meta"><strong>LIVE_IN:</strong> ${b.liveIn} | <strong>LIVE_OUT:</strong> ${b.liveOut}</div>
                </div>
            `).join("");
        }

        function compileCode() {
            const code = document.getElementById("sourceCode").value.trim();
            renderCFGBlocks();

            document.getElementById("outputResult").innerText =
`[Status] Processed input in OptiCore Dashboard!
--- Input Lines: ${code ? code.split("\n").length : 0} ---
--- CFG & Liveness ---
B1 -> B3, B2 | B2 -> B4 | B3 -> B4 | B4 -> []
--- Optimized TAC ---
x = 5
if x > 0 goto POS
y = 100
print y
goto END
label POS
t1 = x + 1
print t1
label END
print x

Removed instructions: 2`;
        }

        // Initial render on page load
        compileCode();
    </script>

</body>
</html>
